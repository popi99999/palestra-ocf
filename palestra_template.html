<title>Palestra OCF</title>
<style>
/* Layout: app shell come il workspace di allenamento — app bar verde fissa 64px, drawer 280px a sinistra, contenuto a destra.
   Aspetto chiaro fisso per scelta (riproduce la schermata d'esame). */
:root{
  color-scheme:light;
  --ocf-brand-green:#2E7D32; --ocf-brand-green-dark:#1B5E20; --ocf-brand-green-soft:#E8F5E9;
  --ocf-ink:#1F2937; --ocf-ink-soft:#4B5563; --ocf-ink-muted:#6B7280; --ocf-line:#E5E7EA; --ocf-red:#C62828;
  --mud-text:#212121; --mud-nav:#424242; --mud-bg:#FAFAFA; --white:#FFFFFF;
  --sim-blue:#1976D2; --sim-purple:#4A148C; --sim-lilac:#B39DDB; --orange:#B7560B; --orange-soft:#FFF4E5;
  --blue-soft:#E3F2FD; --blue-ink:#0D47A1; --red-soft:#FFEBEE; --chip-dark:#424242; --chip-grey:#E0E0E0; --nondata:#E65100;
  --font:Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--mud-bg)}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--mud-text);letter-spacing:.01071em;line-height:1.43}
button{font-family:var(--font)}
.mi svg{width:1em;height:1em;display:block;fill:currentColor}
.mi{font-family:"Material Icons";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga"}
:focus-visible{outline:3px solid var(--ocf-brand-green);outline-offset:2px}

.page,.dialog{zoom:var(--zoom,1)}
/* test a schermo pieno: solo domanda e risposte */
.focus-ctl{display:none}
.focus-chain{display:none}
body.focus .focus-chain:not(:empty){display:flex;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:30;align-items:center;gap:14px;background:#fff;border:1px solid var(--ocf-line);border-radius:999px;padding:9px 16px;box-shadow:0 4px 14px -6px rgba(0,0,0,.2);font-size:16px;font-weight:600;color:var(--ocf-ink)}
.focus-chain .fc-now,.focus-chain .fc-rec{display:inline-flex;align-items:center;gap:6px}
.focus-chain .fc-now .mi{font-size:20px;color:var(--ocf-brand-green)}
.focus-chain .fc-rec{color:#8a6d00}.focus-chain .fc-rec .mi{font-size:20px;color:#c9a227}
body.focus .appbar,body.focus .drawer,body.focus .scrim,body.focus .pagehead,body.focus .mat-tabs,body.focus .sess-chips,body.focus .sess .hint,body.focus #clear,body.focus #end{display:none!important}
body.focus main{margin-left:0;padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
body.focus .page{max-width:1000px;padding-top:0}
body.focus .paper.sess{box-shadow:none;border:0;background:transparent;padding:0}
body.focus .quesito-box__testo{font-size:21px;line-height:1.55}
body.focus .quesito-alt-row{font-size:18px;padding:14px 18px}
body.focus .focus-ctl{display:flex;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:30;align-items:center;gap:4px;background:#fff;border:1px solid var(--ocf-line);border-radius:999px;padding:4px;box-shadow:0 4px 14px -6px rgba(0,0,0,.2)}
.focus-ctl button{min-width:44px;height:40px;border:0;background:transparent;border-radius:999px;font:inherit;font-size:16px;font-weight:600;color:var(--ocf-ink);cursor:pointer;display:grid;place-items:center}
.focus-ctl b{font-size:12px;font-weight:600;color:var(--ocf-ink-muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.focus-ctl #f-exit{border-left:1px solid var(--ocf-line);border-radius:0 999px 999px 0}
main{overflow-x:clip}
.trainbar{zoom:var(--tbz,1)}
.studia-materia-row__meta{flex-wrap:wrap}
.prova-card__date{flex-wrap:wrap}
@media (max-width:767.98px){
  .zoom-big .stat-cards{grid-template-columns:minmax(0,1fr)}
  .zoom-big .studia-materia-row__meta{white-space:normal}
  .zoom-big .ocf-landing-hero__right{gap:16px}
  .zoom-big .test-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when score" "what what" "goal goal"}
  .zoom-big .test-row__n{display:none}
  .zoom-big .prova-card{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"body score" "badge badge"}
  .zoom-big .prova-card[data-prova] .prova-card__num{display:none}
  .zoom-big .day-head__stats{font-size:12px}
  .zoom-big .studia-materia-row.cat-row{grid-template-columns:22px minmax(0,1fr);grid-template-areas:"check badge" "main main" "breakdown breakdown" "levels levels" "actions actions" "subs subs"}
  .zoom-big .cat-row .studia-materia-row__actions{flex-direction:column}
  .zoom-big .grp-sub{grid-template-columns:22px minmax(0,1fr)}
  .zoom-big .sub-name{flex-wrap:wrap}
}
@media (min-width:768px){
  /* poco spazio vero (finestra stretta, menu laterale, testo ingrandito): le righe a colonne fisse passano al formato compatto */
  .narrow .studia-materia-row.cat-row{grid-template-columns:22px 76px minmax(0,1fr);grid-template-areas:"check badge main" "breakdown breakdown breakdown" "levels levels levels" "actions actions actions" "subs subs subs";gap:14px 18px}
  .narrow .studia-materia-row.cat-row .cat-check{grid-area:check}
  .narrow .studia-materia-row.cat-row .studia-materia-row__badge{grid-area:badge}
  .narrow .studia-materia-row.cat-row .studia-materia-row__main{grid-area:main}
  .narrow .studia-materia-row.cat-row .studia-materia-row__breakdown{grid-area:breakdown}
  .narrow .studia-materia-row.cat-row .studia-materia-row__levels{grid-area:levels;flex-direction:row;gap:18px}
  .narrow .studia-materia-row.cat-row .studia-materia-row__levels>*{flex:1 1 0;min-width:0}
  .narrow .studia-materia-row.cat-row .studia-materia-row__actions{grid-area:actions;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
  .narrow .studia-materia-row.cat-row .cat-subs{grid-area:subs}
  .narrow .cat-subs .grp-sub{padding-left:28px}
  .narrow .grp-sub{grid-template-columns:24px minmax(0,1fr);row-gap:8px}
  .narrow .grp-sub .grp-stat,.narrow .grp-sub .grp-acts{grid-column:2}
  .narrow .grp-sub .grp-acts{justify-content:flex-start}
  .narrow .test-row{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"n when score" "n what what" "n goal goal";row-gap:6px;column-gap:10px}
  .narrow .test-row__n{grid-area:n;align-self:start}
  .narrow .test-row__when{grid-area:when}
  .narrow .test-row__what{grid-area:what}
  .narrow .test-row__score{grid-area:score}
  .narrow .test-row__goal{grid-area:goal}
  .narrow .test-row__go{display:none}
  .narrow .totali-card{grid-template-columns:56px minmax(0,1fr) 28px;gap:14px}
  .narrow .totali-card__bar{grid-column:1/-1;grid-row:2}
  .narrow .totali-card__go{grid-row:1;grid-column:3}
}
.linkbtn{white-space:normal;flex-wrap:wrap;text-align:left}
.cardhead{flex-wrap:wrap}
.page .btn{white-space:normal;max-width:100%;text-align:center}
.page .sess-bar .push{max-width:100%}
.page .chip{max-width:100%;white-space:normal;height:auto;min-height:32px;padding-top:4px;padding-bottom:4px}
.page .timer-big,.page .goal-chip{min-height:34px}
.appbar h6{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .quesito-alt-row__body,.page .quesito-box__testo,.page .tq-q{overflow-wrap:anywhere}
@media (max-width:599.98px){ .appbar h6{font-size:15px} .appbar .sep{display:none} }
.zoom-ctl{display:inline-flex;align-items:center;margin-right:4px}
.zoom-val{font-size:12px;font-weight:600;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.nav-zoom{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--mud-nav)}
.nav-zoom>span:nth-child(2){flex:1}
.nav-zoom b{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:599.98px){ .zoom-ctl .zoom-val{display:none} .zoom-ctl .iconbtn{width:40px} }
/* ---------- app bar ---------- */
.appbar{position:fixed;top:0;left:0;right:0;height:calc(64px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--ocf-brand-green);color:var(--white);display:flex;align-items:center;z-index:30;
  box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12)}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.appbar .menu{margin-left:12px}
.brandmark{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;margin-left:8px;flex-shrink:0}
.appbar h6{margin:0 0 0 12px;font-size:20px;font-weight:500;letter-spacing:.0075em;line-height:1.6;flex:1;min-width:0}
.appbar .acts{display:flex;align-items:center;height:100%}
.appbar .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25)}
.appbar .status{padding:0 16px;font-size:14px;line-height:1.35;max-width:300px}
.appbar .status b{display:block;font-weight:700;font-size:13px}
/* ---------- drawer ---------- */
.drawer{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;left:0;width:280px;background:var(--white);overflow-y:auto;z-index:20;transition:transform .2s}
.nav a,.nav button.navlink{display:flex;align-items:center;gap:16px;width:100%;min-height:40px;padding:8px 16px;color:var(--mud-nav);text-decoration:none;font-size:14px;font-weight:400;background:transparent;border:0;cursor:pointer;text-align:left;line-height:1.15}
.nav a:hover,.nav button.navlink:hover{background:rgba(66,66,66,.04)}
.nav a.active{color:var(--ocf-brand-green);font-weight:500;background:rgba(66,66,66,.06)}
.nav a .mi,.nav button.navlink .mi{color:var(--mud-nav);flex-shrink:0;font-size:24px}
.nav a.active .mi{color:var(--ocf-brand-green)}
.nav .two{min-height:44px}
.nav hr{border:0;border-top:1px solid rgba(0,0,0,.12);margin:8px 0}
.nav .group .chev{margin-left:auto;transition:transform .2s}
.nav .group[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nav .sub a{padding-left:56px}
.scrim{position:fixed;inset:0;background:rgba(33,33,33,.4);z-index:19}
/* ---------- main ---------- */
main{margin-left:280px;padding:calc(64px + env(safe-area-inset-top,0px)) 16px 40px;min-height:100vh}
.page{max-width:1200px;margin:0 auto;padding-top:16px}
.pagehead{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.pagehead h1,.browse-item .q,.browse-item .a span{min-width:0;overflow-wrap:anywhere}
.pagehead .mi{color:var(--ocf-brand-green)}
.pagehead h1{margin:0;font-size:24px;font-weight:400;line-height:1.334}
.drawer-closed .drawer{transform:translateX(-100%)}
.drawer-closed main{margin-left:0}
@media (max-width:959.98px){
  main{margin-left:0}
  .drawer{transform:translateX(-100%);box-shadow:0 8px 10px -5px rgba(0,0,0,.2),0 16px 24px 2px rgba(0,0,0,.14)}
  .drawer-open .drawer{transform:none}
  .appbar .status{display:none}
}
@media (max-width:599.98px){ .appbar h6{font-size:17px} .brandmark{display:none} }

/* ---------- mud basics ---------- */
.paper{background:var(--white);border-radius:4px;box-shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36.5px;padding:6px 16px;border-radius:4px;font-size:14px;font-weight:500;letter-spacing:.02857em;text-transform:uppercase;cursor:pointer;border:0;line-height:1.75;text-decoration:none;white-space:nowrap}
.btn .mi{font-size:20px}
.btn-filled{background:var(--ocf-brand-green);color:var(--white);box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12)}
.btn-filled:hover{background:#1f6b24}
.btn-outlined{background:var(--white);color:var(--mud-text);border:1px solid rgba(0,0,0,.87);padding:5px 15px}
.btn-outlined:hover{background:rgba(0,0,0,.04)}
.btn-text{background:transparent;color:var(--mud-text)}
.btn-text:hover{background:rgba(0,0,0,.04)}
.btn-red{background:#D32F2F;color:var(--white);box-shadow:0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12)}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;font-size:14px;white-space:nowrap}
.chip-outline-green{border:1px solid var(--ocf-brand-green);color:var(--ocf-brand-green)}
.chip-outline{border:1px solid rgba(0,0,0,.87);color:var(--mud-text)}
.chip-dark{background:var(--chip-dark);color:var(--white);white-space:normal;height:auto;min-height:32px;padding:4px 12px}
.chip-grey{background:var(--chip-grey);color:var(--mud-text)}
.chip .mi{font-size:18px}
.alert{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--sim-blue);color:var(--blue-ink);border-radius:4px;padding:10px 16px;font-size:14px}
.alert .mi{color:inherit;font-size:22px}

/* ---------- landing (hero + pilastri + step) ---------- */
.ocf-landing-hero{background:linear-gradient(135deg,var(--ocf-brand-green) 0%,var(--ocf-brand-green-dark) 100%);color:#fff;border-radius:16px;box-shadow:0 12px 32px -14px rgba(46,125,50,.55);padding:32px 36px;margin-bottom:28px;position:relative;overflow:hidden}
.ocf-landing-hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 70%);pointer-events:none}
.ocf-landing-hero__inner{display:flex;align-items:center;justify-content:space-between;gap:36px;flex-wrap:wrap;position:relative;z-index:1}
.ocf-landing-hero__left{min-width:0;flex:1 1 360px;max-width:620px}
.ocf-landing-hero__eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.9;margin-bottom:12px}
.ocf-landing-hero__title{font-size:32px;font-weight:500;line-height:1.2;margin:0 0 14px;color:#fff}
.ocf-landing-hero__title b{font-weight:700}
.ocf-landing-hero__subtitle{font-size:15px;line-height:1.55;margin:0 0 22px;opacity:.94;max-width:540px}
.ocf-landing-hero__cta{background:#fff;color:var(--ocf-brand-green-dark);font-weight:600;letter-spacing:.3px;padding:10px 28px;border-radius:8px;box-shadow:0 4px 12px -4px rgba(0,0,0,.25);transition:transform 120ms,box-shadow 120ms}
.ocf-landing-hero__cta:hover{transform:translateY(-1px);box-shadow:0 8px 18px -6px rgba(0,0,0,.3)}
.ocf-landing-hero__right{display:flex;gap:32px;row-gap:20px;align-items:flex-end;flex-wrap:wrap}
.ocf-landing-hero__stat{text-align:right;min-width:88px}
.ocf-landing-hero__stat-value{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:6px}
.ocf-landing-hero__stat-unit{font-size:20px;font-weight:500;opacity:.85;margin-left:2px}
.ocf-landing-hero__stat-label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;opacity:.88}
.ocf-landing-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}
.ocf-landing-pillar{background:#fff;border:1px solid var(--ocf-line);border-radius:12px;padding:22px 22px 20px;transition:transform 160ms,box-shadow 160ms,border-color 160ms;position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit}
.ocf-landing-pillar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ocf-brand-green);opacity:0;transition:opacity 160ms}
.ocf-landing-pillar:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(0,0,0,.15);border-color:var(--ocf-brand-green-soft)}
.ocf-landing-pillar:hover::before{opacity:1}
.ocf-landing-pillar__icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ocf-landing-pillar__icon .mi{font-size:30px}
.ocf-landing-pillar__icon--primary{background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark)}
.ocf-landing-pillar__icon--accent{background:var(--orange-soft);color:var(--orange)}
.ocf-landing-pillar__icon--soft{background:var(--blue-soft);color:var(--blue-ink)}
.ocf-landing-pillar__title{font-size:16px;font-weight:600;margin:0 0 8px;color:var(--ocf-ink)}
.ocf-landing-pillar__text{margin:0;font-size:14px;line-height:1.5;color:var(--ocf-ink-soft)}
.ocf-home-pillar{cursor:pointer;display:flex;flex-direction:column}
.ocf-home-pillar__action{margin-top:auto;padding-top:14px;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--ocf-brand-green);transition:gap 160ms,color 160ms}
.ocf-home-pillar__action .mi{font-size:18px}
.ocf-home-pillar:hover .ocf-home-pillar__action{color:var(--ocf-brand-green-dark);gap:8px}
.ocf-landing-steps{background:#fff;border:1px solid var(--ocf-line);border-radius:12px;padding:24px 28px 26px;margin-bottom:24px}
.ocf-landing-steps__title{font-size:16px;font-weight:600;margin:0 0 18px;color:var(--ocf-ink);letter-spacing:.2px}
.ocf-landing-steps__list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ocf-landing-step{display:flex;align-items:flex-start;gap:14px}
.ocf-landing-step__num{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ocf-landing-step__heading{font-size:14px;font-weight:600;color:var(--ocf-ink);margin-bottom:4px}
.ocf-landing-step__text{font-size:13px;line-height:1.5;color:var(--ocf-ink-soft)}
.ocf-landing-cta-strip{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 28px;background:var(--ocf-brand-green-soft);border:1px solid #C8E6C9;border-radius:12px;flex-wrap:wrap;margin-bottom:24px}
.ocf-landing-cta-strip__text{font-size:15px;font-weight:500;color:var(--ocf-brand-green-dark);flex:1 1 280px}
/* ---------- home: card grafici ---------- */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:24px;margin-bottom:24px;align-items:start}
.card{padding:16px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.cardhead h6{margin:0;font-size:20px;font-weight:400;line-height:1.6;color:var(--mud-text)}
.cardhead .tools{display:flex;gap:4px;color:#616161}
.cardhead .tools .mi{font-size:20px;padding:6px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;margin-bottom:12px}
.barrow .lbl{font-size:13px;color:var(--ocf-ink-soft);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{height:8px;border-radius:999px;background:var(--ocf-line);overflow:hidden}
.barrow .fill{height:100%;background:var(--ocf-brand-green)}
.barrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ocf-ink)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:11px;fill:#616161}
/* ---------- prove effettuate ---------- */
.dashboard-prove{padding:16px}
.dashboard-prove__header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.dashboard-prove__title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--ocf-ink);margin:0 0 4px}
.dashboard-prove__title .mi{color:var(--ocf-brand-green-dark)}
.dashboard-prove__subtitle{margin:0;font-size:13px;color:var(--ocf-ink-soft)}
.dashboard-prove__count{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.dashboard-prove__count-value{font-size:30px;font-weight:700;color:var(--ocf-brand-green-dark);font-variant-numeric:tabular-nums}
.dashboard-prove__count-label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ocf-ink-muted);margin-top:5px}
.dashboard-prove__list{display:flex;flex-direction:column;gap:10px}
.prova-card{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;align-items:center;gap:18px;padding:14px 18px;border:1px solid var(--ocf-line);border-radius:10px;background:#fff;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;transition:transform 140ms,box-shadow 140ms,border-color 140ms}
.prova-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(0,0,0,.18)}
.prova-card:disabled{cursor:default}
.prova-card__num{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.prova-card--superata .prova-card__num{background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark)}
.prova-card--non-superata .prova-card__num{background:var(--red-soft);color:var(--ocf-red)}
.prova-card__num-hash{font-size:13px;font-weight:500;margin-right:1px;opacity:.7}
.prova-card__body{min-width:0}
.prova-card__label{font-size:14px;font-weight:600;color:var(--ocf-ink);margin-bottom:4px}
.prova-card__date{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ocf-ink-soft);font-variant-numeric:tabular-nums}
.prova-card__date .mi{color:var(--ocf-ink-muted);font-size:16px}
.prova-card__date-sep{opacity:.5}
.prova-card__score{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.prova-card__score-value{font-size:24px;font-weight:700;line-height:1}
.prova-card--superata .prova-card__score-value{color:var(--ocf-brand-green-dark)}
.prova-card--non-superata .prova-card__score-value{color:var(--ocf-red)}
.prova-card--nc .prova-card__score-value{color:var(--ocf-ink)}
.prova-card__score-max{font-size:12px;color:var(--ocf-ink-muted);font-weight:500}
.prova-card__badge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.prova-card__badge .mi{font-size:14px}
.prova-card--superata .prova-card__badge{background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark)}
.prova-card--non-superata .prova-card__badge{background:var(--red-soft);color:var(--ocf-red)}
.prova-card--nc .prova-card__num{background:#F4F4F2;color:var(--ocf-ink)}
.prova-card--nc .prova-card__badge{color:var(--ocf-ink)}
/* ---------- studia per materia ---------- */
.studia-materia-list{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.studia-materia-row{position:relative;display:grid;grid-template-columns:56px minmax(0,1.3fr) minmax(220px,1.1fr) minmax(220px,1fr) auto;gap:26px;align-items:center;padding:20px 24px;background:#fff;border:1px solid var(--ocf-line);border-radius:12px;transition:box-shadow 150ms;overflow:hidden}
.studia-materia-row:hover{box-shadow:0 4px 14px -6px rgba(0,0,0,.12)}
.studia-status-stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ocf-brand-green)}
.studia-badge{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.studia-badge--attiva{background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green)}
.studia-badge--inattiva{background:#F4F4F2;color:var(--ocf-ink-muted)}
.studia-materia-row__main{min-width:0}
.studia-materia-row__meta{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;color:var(--ocf-ink-soft);font-variant-numeric:tabular-nums;margin-bottom:6px}
.studia-materia-row__meta b{color:var(--ocf-ink);font-weight:600}
.studia-materia-row__title{margin:0;font-size:16px;font-weight:500;line-height:1.35;color:var(--ocf-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.studia-materia-row__breakdown{min-width:0}
.studia-materia-row__breakdown-label{font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--ocf-ink-soft);margin-bottom:6px}
.studia-materia-row__breakdown-label b{color:var(--ocf-ink);font-weight:600;font-variant-numeric:tabular-nums}
.studia-breakdown{height:8px;border-radius:999px;overflow:hidden;background:var(--ocf-line);display:flex}
.studia-breakdown__seg{height:100%}
.studia-breakdown__seg--esatte{background:var(--ocf-brand-green)}
.studia-breakdown__seg--errate{background:var(--ocf-red)}
.studia-breakdown-legend{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--ocf-ink-soft);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.studia-breakdown-legend__item{display:inline-flex;align-items:center;gap:6px}
.studia-breakdown-legend__dot{width:8px;height:8px;border-radius:999px;display:inline-block}
.studia-breakdown-legend__dot--esatte{background:var(--ocf-brand-green)}
.studia-breakdown-legend__dot--errate{background:var(--ocf-red)}
.studia-breakdown-legend__dot--nondate{background:var(--ocf-ink-muted);opacity:.55}
.studia-breakdown-empty{margin-top:8px;font-size:12px;font-style:italic;color:var(--ocf-ink-muted)}
.studia-materia-row__levels{display:flex;flex-direction:column;gap:9px;min-width:0}
.studia-level-meter__header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--ocf-ink-soft);margin-bottom:5px}
.studia-level-meter__value{font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}
.studia-level-meter__value b{color:var(--ocf-ink);font-weight:600}
.studia-level-meter__value-max{color:var(--ocf-ink-muted);font-weight:400}
.studia-level-meter{height:5px;border-radius:999px;overflow:hidden;background:var(--ocf-line)}
.studia-level-meter__fill{height:100%;background:var(--ocf-brand-green);transition:width 200ms}
.studia-materia-row__actions{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.studia-materia-row__cta{min-width:124px;letter-spacing:.4px;font-size:13px;padding:11px 22px;border-radius:6px}
/* ---------- sessione (studio / esercitazione / simulazione) ---------- */
.sess{padding:16px;display:flex;flex-direction:column;gap:12px}
.sess-chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sess-chips .right{margin-left:auto}
.pulsantiera-sim,.pulsantiera-quesiti{display:flex;flex-wrap:wrap;gap:4px}
.psim-q,.pul-q{min-width:34px;height:32px;padding:0 6px;border-radius:4px;font-weight:600;cursor:pointer;transition:background .1s,transform .05s;border:2px solid transparent;font-size:.85rem;font-family:var(--font)}
@media (hover:hover){ .psim-q:hover{background:var(--sim-lilac)!important;color:#fff} }
.psim-nonrisposto{background:var(--sim-blue);color:#fff;border-color:var(--sim-blue)}
.psim-risposto{background:var(--sim-purple);color:#fff;border-color:var(--sim-purple)}
.psim-corrente{background:#fff;color:var(--ocf-brand-green);border-color:var(--sim-lilac)!important;box-shadow:0 0 0 1px var(--sim-lilac)}
.pul-q{color:#fff}
.pul-esatta{background:#2e7d32;border-color:#2e7d32}
.pul-errata{background:#c62828;border-color:#c62828}
.pul-nondata{background:var(--sim-blue);border-color:var(--sim-blue)}
.pul-corrente{box-shadow:0 0 0 2px var(--sim-lilac)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:8px}
.psim-leg,.pul-leg{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.1)}
.quesito-box{position:relative;border:1px solid var(--ocf-line);border-radius:8px;padding:22px 22px 18px;margin:18px 0 10px;background:#fff;box-shadow:0 1px 3px -1px rgba(46,125,50,.06)}
.quesito-box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px 0 0 8px;background:var(--ocf-brand-green)}
.quesito-box__label{position:absolute;top:-10px;left:14px;background:#fff;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ocf-brand-green-dark)}
.quesito-box__testo{font-size:17px;font-style:italic;line-height:1.6;color:var(--ocf-ink)}
.quesito-alt-list{display:flex;flex-direction:column;gap:8px}
.quesito-alt-row{display:flex;align-items:flex-start;gap:14px;padding:12px 16px;border-radius:6px;border:1px solid var(--ocf-line);background:#fff;font-size:15px;line-height:1.55;color:var(--ocf-ink);width:100%;text-align:left;font-family:var(--font)}
.quesito-alt-row__letter{flex-shrink:0;font-weight:700;color:var(--ocf-ink);min-width:18px;font-size:15px}
.quesito-alt-row__body{flex:1 1 auto;min-width:0}
.quesito-alt-row__tag{flex-shrink:0;font-size:12px;font-style:italic;color:var(--ocf-ink-muted);margin-left:8px;white-space:nowrap}
.quesito-alt-row--interactive{cursor:pointer;user-select:none;transition:background 120ms,border-color 120ms,box-shadow 120ms}
@media (hover:hover){ .quesito-alt-row--interactive:hover{background:var(--ocf-brand-green-soft);border-color:#A5D6A7} }
.quesito-alt-row--selected{background:var(--ocf-brand-green-soft);border-color:var(--ocf-brand-green);box-shadow:inset 0 0 0 1px var(--ocf-brand-green)}
.quesito-alt-row--selected .quesito-alt-row__letter{color:var(--ocf-brand-green-dark)}
.quesito-alt-row--corretta{background:var(--ocf-brand-green);border-color:var(--ocf-brand-green);color:#fff}
.quesito-alt-row--corretta .quesito-alt-row__letter,.quesito-alt-row--corretta .quesito-alt-row__tag{color:#fff}
.quesito-alt-row--data{background:#F44336;border-color:#F44336;color:#fff}
.quesito-alt-row--data .quesito-alt-row__letter,.quesito-alt-row--data .quesito-alt-row__tag{color:#fff}
.sess-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.sess-bar .push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.navtext{background:transparent;border:0;font-family:var(--font);font-size:14px;font-weight:500;letter-spacing:.02857em;text-transform:uppercase;color:var(--mud-text);display:inline-flex;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;border-radius:4px}
.navtext:hover{background:rgba(0,0,0,.04)}
.navtext:disabled{color:rgba(0,0,0,.38);cursor:default;background:transparent}
.navtext .mi{font-size:20px}
.timer-chip{font-variant-numeric:tabular-nums}
.timer-chip.low{background:#FDECEA;color:var(--ocf-red)}
/* ---------- riepilogo ---------- */
.riepilogo-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--ocf-ink);margin:0 0 4px}
.riepilogo-title .mi{color:var(--ocf-brand-green-dark)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.stat-card{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;border:1px solid var(--ocf-line);border-radius:12px;background:#fff;transition:transform 140ms,box-shadow 140ms}
.stat-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(0,0,0,.12)}
.stat-card__icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.stat-card__icon .mi{font-size:22px}
.stat-card__label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ocf-ink-soft);font-weight:600}
.stat-card__value{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ocf-ink)}
.stat-card--visualizzati .stat-card__icon{background:var(--blue-soft);color:var(--blue-ink)}
.stat-card--esatte .stat-card__icon{background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark)}
.stat-card--esatte .stat-card__value{color:var(--ocf-brand-green-dark)}
.stat-card--errate .stat-card__icon{background:var(--red-soft);color:var(--ocf-red)}
.stat-card--errate .stat-card__value{color:var(--ocf-red)}
.stat-card--non-date .stat-card__icon{background:var(--orange-soft);color:var(--orange)}
.stat-card--non-date .stat-card__value{color:var(--orange)}
.punteggio-hero{display:flex;align-items:center;gap:22px;padding:22px 28px;border-radius:14px;margin-top:2px;color:#fff;background:linear-gradient(135deg,var(--ocf-brand-green) 0%,var(--ocf-brand-green-dark) 100%);box-shadow:0 10px 24px -14px rgba(46,125,50,.5);flex-wrap:wrap}
.punteggio-hero--non-superato{background:linear-gradient(135deg,#C62828 0%,#8B1A1A 100%);box-shadow:0 10px 24px -14px rgba(198,40,40,.5)}
.punteggio-hero__icon{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);flex-shrink:0}
.punteggio-hero__icon .mi{font-size:32px;color:#fff}
.punteggio-hero__body{flex:1 1 200px;min-width:0}
.punteggio-hero__label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;opacity:.92;margin-bottom:6px}
.punteggio-hero__value{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.punteggio-hero__value-max{font-size:18px;font-weight:500;opacity:.85;margin-left:2px}
.punteggio-hero__badge{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.punteggio-hero__badge .mi{font-size:16px;color:#fff}
.rq{border:1px solid rgba(0,0,0,.42);border-radius:4px;padding:12px 12px 14px;display:flex;flex-direction:column}
.rq-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.rq .quesito-box{margin:14px 0 12px}
.badge-esito{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;color:#fff}
.badge-esatta{background:var(--ocf-brand-green)} .badge-errata{background:var(--ocf-red)} .badge-nondata{background:var(--nondata)}
.expander{border-radius:4px;margin-top:4px}
.expander summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;cursor:pointer;font-size:16px}
.expander summary::-webkit-details-marker{display:none}
.expander[open] summary .mi{transform:rotate(180deg)}
.tablewrap{overflow-x:auto}
table.mud{width:100%;border-collapse:collapse;font-size:14px}
table.mud th{font-weight:500;text-align:left;padding:12px 16px;border-bottom:1px solid #E0E0E0;color:var(--mud-text)}
table.mud td{padding:12px 16px;border-bottom:1px solid #E0E0E0}
table.mud td.num,table.mud th.num{text-align:right;font-variant-numeric:tabular-nums}
/* ---------- dialog ---------- */
.dialog-scrim{position:fixed;inset:0;background:rgba(33,33,33,.5);z-index:50;display:flex;padding:16px;overflow:auto}
.dialog{background:#fff;border-radius:4px;box-shadow:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12);width:min(600px,100%);max-height:calc(90vh / var(--zoom,1));overflow:auto;margin:auto}
.dialog h2{margin:0;padding:16px 24px 0;font-size:14px;font-weight:400;color:var(--mud-text)}
.dialog .body{padding:16px 24px;font-size:16px;line-height:1.5}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;padding:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:12px;color:var(--ocf-ink-soft);font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.field select,.field input{font-family:var(--font);font-size:15px;padding:9px 10px;border:1px solid rgba(0,0,0,.42);border-radius:4px;background:#fff;color:var(--mud-text);max-width:100%}
.radio-row{display:flex;flex-direction:column;gap:6px}
.radio-row label{display:flex;gap:8px;align-items:center;font-size:15px}
.radio-row input{accent-color:var(--ocf-brand-green);width:18px;height:18px;flex-shrink:0}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{accent-color:var(--ocf-brand-green);width:18px;height:18px}
.hint{font-size:13px;color:var(--ocf-ink-soft);margin:4px 0 0}
/* ---------- argomenti e sottogruppi ---------- */
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--ocf-brand-green);font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:.4px;background:none;border:0;cursor:pointer;padding:4px 0;margin-bottom:8px}
.backlink .mi{font-size:20px}
.selbar{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;margin:0 0 14px;background:var(--ocf-brand-green-soft);border:1px solid #C8E6C9;border-radius:12px}
.selbar__text{font-size:15px;font-weight:500;color:var(--ocf-brand-green-dark)}
.selbar__acts{display:flex;gap:8px;flex-wrap:wrap}
.grp-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.grp-list{display:flex;flex-direction:column;gap:10px}
.grp{background:#fff;border:1px solid var(--ocf-line);border-radius:12px;overflow:hidden;position:relative}
.grp.has-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ocf-brand-green)}
.grp-head,.grp-sub{display:grid;align-items:center;gap:14px}
.grp-head{grid-template-columns:24px 36px minmax(0,1fr) minmax(170px,240px) auto;padding:14px 18px}
.grp-sub{grid-template-columns:24px minmax(0,1fr) minmax(150px,220px) auto;padding:10px 18px 10px 72px;border-top:1px solid var(--ocf-line);background:#FCFCFB}
.grp input[type=checkbox]{accent-color:var(--ocf-brand-green);width:18px;height:18px;margin:0;cursor:pointer}
.expbtn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--ocf-ink-soft);display:grid;place-items:center;cursor:pointer}
.expbtn:hover{background:rgba(0,0,0,.05)}
.expbtn .mi{transition:transform .2s}
.grp[data-open="1"] .expbtn .mi{transform:rotate(180deg)}
.grp-title{margin:0;font-size:16px;font-weight:500;color:var(--ocf-ink);line-height:1.35;cursor:pointer}
.grp-subtitle{font-size:14px;color:var(--ocf-ink);line-height:1.35;overflow-wrap:anywhere;min-width:0}
.grp-meta{font-size:12px;color:var(--ocf-ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
.grp-meta b{color:var(--ocf-ink);font-weight:600}
.grp-stat .studia-breakdown{height:6px}
.grp-stat__row{display:flex;justify-content:space-between;font-size:11px;color:var(--ocf-ink-soft);margin-bottom:5px;font-variant-numeric:tabular-nums;gap:8px}
.grp-stat__row b{color:var(--ocf-ink);font-weight:600}
.grp-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.btn-sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn-sm .mi{font-size:18px}
.btn-outlined.btn-sm{padding:2px 9px}
.filterchip{display:inline-flex;align-items:center;gap:6px;background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark);border-radius:16px;padding:4px 6px 4px 12px;font-size:13px;font-weight:500;max-width:100%}
.filterchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filterchip button{border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;padding:0}
.filterchip .mi{font-size:18px}
@media (max-width:767.98px){
  .grp-head{grid-template-columns:24px 36px minmax(0,1fr);row-gap:10px;padding:14px 14px}
  .grp-head .grp-stat,.grp-head .grp-acts{grid-column:3}
  .grp-head .grp-acts{justify-content:flex-start}
  .grp-sub{grid-template-columns:24px minmax(0,1fr);row-gap:8px;padding:10px 14px 10px 28px}
  .grp-sub .grp-stat,.grp-sub .grp-acts{grid-column:2}
  .grp-sub .grp-acts{justify-content:flex-start}
}
/* ---------- home materia unica ---------- */
.totali-card{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(220px,320px) 32px;gap:22px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--ocf-line);border-radius:12px;padding:22px 24px;margin:0 0 16px;cursor:pointer;transition:transform 140ms,box-shadow 140ms,border-color 140ms;position:relative;overflow:hidden}
.totali-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ocf-brand-green)}
.totali-card:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px rgba(0,0,0,.18);border-color:#C8E6C9}

.totali-card__meta{font-size:13px;color:var(--ocf-ink-soft)}
.totali-card__bar{display:flex;flex-direction:column;gap:2px;min-width:0}

.quick{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.cat-sum{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--ocf-line);border-radius:12px;padding:16px 20px;margin:0 0 14px;font-size:15px;color:var(--ocf-ink-soft);line-height:1.5}
.cat-sum b{color:var(--ocf-ink)}
.cat-sum__big{font-size:40px;font-weight:700;color:var(--ocf-brand-green-dark);line-height:1;font-variant-numeric:tabular-nums}
.grp-meta .cnt{display:inline-block;background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark);font-weight:700;border-radius:10px;padding:0 8px;font-size:13px;line-height:20px}
/* barra allenamento */
.page:has(.trainbar){padding-bottom:8px}
.trainbar{position:sticky;bottom:0;z-index:6;margin:16px -16px 0;background:#fff;border-top:1px solid var(--ocf-line);box-shadow:0 -8px 20px -12px rgba(0,0,0,.18);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}

.trainbar__opts{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;flex:1;min-width:0}

.tb-field select{font-family:var(--font);font-size:15px;padding:7px 8px;border:1px solid rgba(0,0,0,.42);border-radius:4px;background:#fff;color:var(--mud-text);text-transform:none;letter-spacing:0}

.tb-num .mi{font-size:20px}
.tb-num input{width:64px;border:0;text-align:center;font-family:var(--font);font-size:16px;font-weight:600;padding:6px 0;color:var(--mud-text);-moz-appearance:textfield}
.tb-num input::-webkit-inner-spin-button{-webkit-appearance:none}
.tb-presets{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--ocf-brand-green);background:#fff;color:var(--ocf-brand-green);border-radius:16px;height:30px;padding:0 12px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer}
.chip-btn.on{background:var(--ocf-brand-green);color:#fff}
.tb-field .tb-goal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-transform:none;letter-spacing:normal;font-weight:400}
.tb-goal input{width:60px;height:32px;border:1px solid var(--ocf-line);border-radius:6px;padding:0 8px;font:inherit;font-size:14px;text-align:center;background:#fff}
.tb-goal small{font-size:12px;color:var(--ocf-ink-muted);text-transform:none;letter-spacing:normal}
.trainbar__go{min-height:44px;padding:8px 22px;font-size:15px}
.tb-toggle{display:none}
@media (max-width:1180px){

  .trainbar .tb-toggle{display:inline-flex}
  .trainbar:not(.tb-open) .trainbar__opts{display:none}
  .trainbar .trainbar__info{flex:1 1 auto}
  .trainbar.tb-open .trainbar__opts{flex:1 1 100%;order:3}
}
@media (max-width:767.98px){

  .totali-card__bar{grid-column:1/-1;grid-row:2}

  .totali-card__value{font-size:38px}
  .cat-sum{flex-direction:column;align-items:flex-start;gap:6px}
  .trainbar{flex-direction:column;align-items:stretch;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  .trainbar__info{flex-direction:row;justify-content:space-between;align-items:baseline;min-width:0}
  .trainbar__opts{gap:8px 12px}
  .tb-presets{display:none}
  .tb-field{font-size:11px;gap:6px}
  .tb-field select{font-size:14px;padding:6px}
  .tb-num button{width:30px;height:34px}
  .tb-num input{width:46px;font-size:15px}
  .trainbar .check{font-size:14px;grid-column:1/-1}
  .trainbar__info{flex-wrap:wrap;gap:0 8px}
  .trainbar__goal{flex-basis:100%;font-size:12px}
  .trainbar__opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
  .trainbar .tb-field{flex-direction:column;align-items:stretch;gap:2px;font-size:10px}
  .trainbar .tb-field select{width:100%;font-size:13px;padding:5px}
  .trainbar .tb-num{align-self:flex-start}
  .trainbar__go{width:100%;min-height:42px}
}
/* ---------- cronometro ---------- */
.timer-big{background:#263238;color:#fff;font-weight:600;font-size:16px;height:34px;padding:0 14px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.timer-big .mi{font-size:20px}
.timer-big .timer-lbl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;opacity:.75}
.timer-big.low{background:#C62828;color:#fff}
.tempo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ocf-ink-soft);background:#F5F5F5;border-radius:8px;padding:10px 14px}
.tempo-row b{color:var(--ocf-ink);font-variant-numeric:tabular-nums}
.tempo-row .mi{color:var(--ocf-brand-green-dark);font-size:20px}
.tempo-row .sep{opacity:.5}
.tempo-row .muted{color:var(--ocf-ink-muted)}
/* ---------- test fatti ---------- */
.test-list{display:flex;flex-direction:column;gap:8px}
.test-row{display:grid;grid-template-columns:44px 150px minmax(0,1fr) 92px 140px 24px;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--ocf-line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:box-shadow 140ms,border-color 140ms}
.test-row:hover{box-shadow:0 6px 16px -10px rgba(0,0,0,.2);border-color:#C8E6C9}
.test-row__n{font-weight:700;color:var(--ocf-ink-muted);font-variant-numeric:tabular-nums}
.test-row__when,.test-row__what,.test-row__score{display:flex;flex-direction:column;gap:2px;min-width:0}
.test-row__when b{font-size:14px;color:var(--ocf-ink)} .test-row__when span{font-size:12px;color:var(--ocf-ink-soft);font-variant-numeric:tabular-nums}
.test-row__what b{font-size:14px;font-weight:600;color:var(--ocf-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test-row__what span{font-size:12px;color:var(--ocf-ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test-row__score{align-items:flex-end;font-variant-numeric:tabular-nums}
.test-row__score b{font-size:18px} .test-row__score span{font-size:12px;font-weight:600}
.test-row__score.ok b,.test-row__score.ok span{color:var(--ocf-brand-green-dark)} .test-row__score.mid b,.test-row__score.mid span{color:#B7560B} .test-row__score.ko b,.test-row__score.ko span{color:var(--ocf-red)}
.test-row__goal{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:12px;padding:3px 10px;justify-self:start;white-space:nowrap}
.test-row__goal .mi{font-size:15px}
.test-row__goal.ok{background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark)} .test-row__goal.ko{background:#FFEBEE;color:#C62828}
.test-row__go{color:var(--ocf-ink-muted)}
.test-row__title{display:flex;align-items:center;gap:6px;min-width:0}
.test-row__title b{min-width:0}
.tag-cut{flex-shrink:0;font-style:normal;display:inline-block;font-size:11px;font-weight:600;background:#FFF4E5;color:#B7560B;border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:middle}
.tmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:8px 16px;background:#FAFAFA;border:1px solid var(--ocf-line);border-radius:8px;padding:12px 14px}
.tmeta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tmeta span{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ocf-ink-muted);font-weight:600}
.tmeta b{font-size:14px;color:var(--ocf-ink);font-weight:500}
.tq-list{display:flex;flex-direction:column;gap:8px}
.tq{border:1px solid var(--ocf-line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.tq-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ocf-ink-soft)}
.tq-n{font-weight:700;color:var(--ocf-ink);min-width:20px}
.tq-cat{flex:1;min-width:0}
.tq-sec{font-variant-numeric:tabular-nums;color:var(--ocf-ink-muted)}
.tq-q{font-style:italic;font-size:15px;color:var(--ocf-ink)}
.t-actions{display:flex;gap:10px;flex-wrap:wrap}
.b-tools{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.an-wrap{overflow-x:auto;background:#fff;border:1px solid var(--ocf-line);border-radius:10px}
.an{width:100%;border-collapse:collapse;font-size:13.5px}
.an th{position:sticky;top:0;background:var(--ocf-brand-green);color:#fff;font-weight:600;text-align:right;padding:8px 10px;white-space:nowrap}
.an th:nth-child(2),.an th:last-child{text-align:left}
.an td{padding:6px 10px;border-top:1px solid var(--ocf-line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
.an td.an-lab{text-align:left;min-width:180px} .an td.an-n{color:var(--ocf-ink-muted);width:24px}
.an tr.an-cat td{background:#F3F8F3;font-weight:600}
.an tr.an-sub td.an-lab{padding-left:26px;font-weight:400;color:var(--ocf-ink-soft)}
.an td.an-ko{color:var(--ocf-red);font-weight:700}
.an td.an-notecell{text-align:left;min-width:220px}
@media (max-width:1100px){ .an td.an-notecell{min-width:120px} .an th,.an td{padding-left:6px;padding-right:6px} }
@media (pointer:coarse){ input,select,textarea,.an-note{font-size:16px !important} }
.an-note{width:100%;min-height:30px;resize:vertical;border:1px solid var(--ocf-line);border-radius:6px;padding:5px 7px;font:inherit;font-size:13px;background:#fff;overflow:hidden}
#print{display:none}
@media print{
  html,body{background:#fff!important}
  body.printing>*:not(#print){display:none!important}
  body.printing #print{display:block!important;color:#000;font:11pt/1.35 Helvetica,Arial,sans-serif}
  .pr h1{font-size:16pt;margin:0 0 4px} .pr h2{font-size:12.5pt;margin:16px 0 8px;text-align:center}
  .pr-head{border-bottom:2px solid #2E7D32;padding-bottom:8px} .pr-head div{margin:2px 0}
  .pr-box{border:1px solid #000;padding:6px 8px;margin:0 0 8px;break-inside:avoid}
  .pr-row{display:flex;gap:18px;flex-wrap:wrap} .pr-row .ok{color:#2E7D32;font-weight:700} .pr-row .ko{color:#C62828;font-weight:700}
  .pr-cat{font-size:9.5pt;color:#444;margin-top:2px} .pr-text{font-weight:700;margin:4px 0}
  .pr-alt{padding-left:16px;position:relative} .pr-alt.good{font-weight:600} .pr-v{position:absolute;left:0;font-weight:700}
  .pr-break{break-before:page} .pr-foot{font-size:9pt;color:#555;margin-top:12px}
}
.tq-alts{display:flex;flex-direction:column;gap:4px}
.tq-alt{display:grid;grid-template-columns:14px 18px minmax(0,1fr);gap:6px;align-items:baseline;font-size:14px;padding:4px 8px;border-radius:6px;color:var(--ocf-ink)}
.tq-alt.good{background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark)}
.tq-alt.bad{background:#FFEBEE;color:#C62828}
.tq-alt i{grid-column:3;font-size:11px;font-style:normal;font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.tq-v{font-weight:700}
.tq-lv{font-size:12px;color:var(--ocf-ink-muted);white-space:nowrap}
.zoom-big .tq-cat{order:9;flex:1 1 100%} /* col testo grande la categoria va su una riga sua */
.tq-a{display:flex;gap:8px;align-items:flex-start;background:var(--ocf-brand-green-soft);color:var(--ocf-brand-green-dark);border-radius:6px;padding:6px 10px;font-size:14px}
.tq-a .mi{font-size:18px}
@media (max-width:767.98px){
  .test-row{grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"n when score" "n what what" "n goal goal";row-gap:6px;column-gap:10px}
  .test-row__n{grid-area:n;align-self:start}.test-row__when{grid-area:when}.test-row__what{grid-area:what}.test-row__score{grid-area:score}.test-row__goal{grid-area:goal}.test-row__go{display:none}
}
/* ---------- giorni ---------- */

.day-head__stats .ok b{color:var(--ocf-brand-green-dark)} .day-head__stats .mid b{color:#B7560B} .day-head__stats .ko b{color:var(--ocf-red)}

.pdf-block{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--ocf-line)}

function simChart(){
  const all=simsDone(), pts=all.slice(-20).map(simScore);
  const W=440,H=300,l=36,r=16,t=14,b=34, iw=W-l-r, ih=H-t-b;
  const y=v=>t+ih-(v/100)*ih;
  const n=Math.max(1,pts.length);
  const x=i=> n===1? l+iw/2 : l+(i/(n-1))*iw;
  let g="";
  for(let v=0; v<=100; v+=20) g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"#9E9E9E":"#E0E0E0"}" stroke-width="1"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  g+=`<line x1="${l}" x2="${W-r}" y1="${y(80)}" y2="${y(80)}" stroke="#C62828" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-r}" y="${y(80)-6}" text-anchor="end" style="fill:#C62828">soglia 80</text>`;
  if(pts.length){
    g+=`<polyline fill="none" stroke="#2E7D32" stroke-width="2" points="${pts.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
    g+=pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===pts.length-1?5:3.5}" fill="${v>=80?"#2E7D32":"#C62828"}"/>`).join("");
    const step=Math.ceil(pts.length/8);
    g+=pts.map((v,i)=> (i%step===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-12}" text-anchor="middle">#${all.length-pts.length+i+1}</text>`:"").join("");
  } else g+=`<text x="${l+iw/2}" y="${t+ih/2}" text-anchor="middle">Nessuna simulazione completata</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Punteggi delle ultime simulazioni">${g}</svg>`;
}

/* ================= ARGOMENTI E SOTTOGRUPPI ================= */
function groupsOf(m){
  // argomenti (contenuti OCF) e sottogruppi (sub-contenuti) nell'ordine della banca dati
  const conts=new Map();
  for(const n of BY_MAT[m]){ const q=Q[n-1]; if(!conts.has(q[1])) conts.set(q[1],{ci:q[1],ids:[],subs:new Map()}); const c=conts.get(q[1]); c.ids.push(n); if(!c.subs.has(q[2])) c.subs.set(q[2],{si:q[2],ids:[]}); c.subs.get(q[2]).ids.push(n); }
  const list=[...conts.values()].map(c=>({ci:c.ci, ids:c.ids, subs:[...c.subs.values()]}));
  // ordine delle categorie come nel libro di Brando; quelle non elencate restano in fondo nell'ordine della banca dati
  const pos=c=>{ const name=CONT[c.ci].toLowerCase(); const i=BOOK_ORDER.findIndex(k=>name.startsWith(k)); return i<0?BOOK_ORDER.length:i; };
  return list.map((c,i)=>({c,i})).sort((a,b)=>pos(a.c)-pos(b.c)||a.i-b.i).map(x=>x.c);
}
const BOOK_ORDER = ["l'impresa","beni e diritti reali","matrimonio","titoli di credito","scritture contabili","società di persone","risoluzione e invalidità","vicende modificative","le obbligazioni","conclusione, interpretazione","contratti tipici","società di capitali"];
function gstats(ids){
  let seen=0,ok=0,wr=0,att=0,cor=0;
  for(const n of ids){ const r=S.m[Q[n-1][0]][n]; if(!r) continue; seen++; att+=r[0]; cor+=r[1]; if(r[2]) ok++; else wr++; }
  return {tot:ids.length, seen, ok, wr, acc:att?Math.round(cor/att*100):null};
}
function statBlock(ids){
  const s=gstats(ids), w=v=>(v/s.tot*100).toFixed(2)+"%";
  return `<div class="grp-stat"><div class="grp-stat__row"><span><b>${s.seen}</b>/${s.tot} visti</span><span>${s.acc===null?"":`<b>${s.acc}%</b> esatte`}${s.wr?` · <span style="color:var(--ocf-red)">${s.wr} da ripassare</span>`:""}</span></div>
    <div class="studia-breakdown"><span class="studia-breakdown__seg studia-breakdown__seg--esatte" style="width:${w(s.ok)}"></span><span class="studia-breakdown__seg studia-breakdown__seg--errate" style="width:${w(s.wr)}"></span></div></div>`;
}

/* ================= ANALISI ERRORI (come il foglio "Analisi" del DB Mediolanum) ================= */
function errStats(ids){
  // Errori = domande sbagliate almeno una volta · Errori 2 = sbagliate di nuovo (2 o più volte) · Da ripassare = ultima risposta sbagliata
  let e1=0,e2=0,last=0,seen=0; const wrongIds=[];
  for(const n of ids){ const r=S.m[Q[n-1][0]][n]; if(!r) continue; seen++; const w=r[0]-r[1]; if(w>=1){ e1++; wrongIds.push(n); } if(w>=2) e2++; if(!r[2]) last++; }
  return {tot:ids.length, seen, e1, e2, last, wrongIds};
}
function renderAnalisi(){
  const G=groupsOf(ONLY), all=errStats(BY_MAT[ONLY]), N=S.n||{};
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  const note=(key)=>{ const v=N[key]; return `<textarea class="an-note" data-note="${esc(key)}" rows="1" placeholder="Note…">${esc(v?v[1]:"")}</textarea>`; };
  const row=(lab,key,st,cls,num)=>`<tr class="${cls}"><td class="an-n">${num||""}</td><td class="an-lab">${esc(lab)}</td><td>${st.tot}</td><td class="${st.e1?"an-ko":""}">${st.e1}</td><td class="${st.e2?"an-ko":""}">${st.e2}</td><td>${pct(st.e1,st.tot)}</td><td>${pct(st.e2,st.tot)}</td><td>${st.e1?`<button class="btn btn-text btn-sm" data-anerr="${esc(key)}">${icon("replay")} ${st.e1}</button>`:""}</td><td class="an-notecell">${note(key)}</td></tr>`;
  const groups={}; let rows="";
  G.forEach((g,i)=>{ const k=CONT[g.ci]; const st=errStats(g.ids); groups[k]=st.wrongIds; rows+=row(k,k,st,"an-cat",i+1);
    g.subs.forEach(su=>{ const sk=k+" › "+(SUB[su.si]||"—"), ss=errStats(su.ids); groups[sk]=ss.wrongIds; rows+=row(SUB[su.si]||"—",sk,ss,"an-sub"); }); });
  $("#view").innerHTML = `${head("fact_check","Analisi errori")}
  <p class="hint" style="margin:-6px 0 14px">Come il foglio «Analisi» del DB Mediolanum, per ogni argomento della materia. <b>Errori</b>: domande sbagliate almeno una volta (anche con «Non la so»). <b>Errori 2</b>: domande sbagliate di nuovo, due o più volte. Le percentuali sono sul numero di quesiti dell'argomento. Le <b>Note</b> si salvano da sole e si vedono su tutti i dispositivi.</p>
  <div class="stat-cards" style="margin-bottom:16px">
    <div class="stat-card"><span class="stat-card__label">Quesiti</span><span class="stat-card__value">${all.tot}</span><span class="stat-card__sub">${G.length} argomenti · ${G.reduce((a,g)=>a+g.subs.length,0)} sottoargomenti</span></div>

function buildMigliora(){
  const picks=new Set();
  shuffle([1,2,3,4,5].flatMap(errorsOf)).slice(0,12).forEach(n=>picks.add(n));
  const weight=m=>{ const s=matStats(m); return (s.acc===null?0.5:1-s.acc)+0.2; };
  const mats=[1,2,3,4,5]; let guard=0;
  while(picks.size<20 && guard++<500){
    const tw=mats.reduce((a,m)=>a+weight(m)*MAT[m].sim,0); let r=Math.random()*tw, m=1;
    for(const k of mats){ r-=weight(k)*MAT[k].sim; if(r<=0){ m=k; break; } }
    const pool=BY_MAT[m].filter(n=>!S.m[m][n] && !picks.has(n)), src=pool.length?pool:BY_MAT[m];
    picks.add(src[Math.floor(Math.random()*src.length)]);
  }
  return {kind:"migliora", title:"Esercitazione adattiva", ids:shuffle([...picks]), fb:"end", perQ:60};
}

  }

    ${bonusDone?`<div class="alert alert-chain">${icon("replay")}<span><b>Bonus finito.</b> Tra pochi secondi si riparte dall'inizio del blocco (oppure tocca Ricomincia).</span></div>`:""}

  const c=$("#clear"); if(c) c.onclick=()=>{ it.pick=null; renderSession(); };
  const nl=$("#nonloso"); if(nl) nl.onclick=()=>dontKnow();
  const p=$("#prev"); if(p) p.onclick=()=>{ if(T.i>0){ T.i--; renderSession(); } };

function dontKnow(){
  const T=state.T, it=T.items[T.i];
  if(T.kind==="sim" || it.locked || (it.pick!==null && (T.fb==="now"||it.pick===-2))) return;
  it.pick=-2; it.locked=true; if(T.chain){ chainBreak(T); if(T.i>=T.bonusEnd) chainAutoRestart(); } renderSession(); saveLive();
}
function choose(orig){
  const T=state.T, it=T.items[T.i];
  if(it.locked || (T.fb==="now" && it.pick!==null)) return;
  it.pick=orig;
  if(T.chain && orig===0){ if(T.chainBroken==null){ const st=T.i+1; if(st>chainBest(T.chain.m)) lsSet(CHAIN_KEY+T.chain.m, String(st)); }
    const at=T.i, id=T.id; setTimeout(()=>{ const U=state.T; if(U && U.id===id && !U.done && U.i===at && state.view==="session" && !dialogOpen()) advance(); }, 900); }
  else if(T.chain){ chainBreak(T); if(T.i>=T.bonusEnd) chainAutoRestart(); } // sbagliata: parte il bonus (o, se era l'ultima del bonus, si riparte)
  renderSession(); saveLive();
}
function advance(){
  const T=state.T, it=T.items[T.i];
  if(T.chain && T.chainBroken!=null && T.i>=T.bonusEnd){ restartChain(); return; } // finito il bonus: si riparte dall'inizio del blocco
  if(T.chain && T.chainBroken==null && T.i===T.items.length-1 && it.pick===0){ it.locked=true; if(it.spent==null) it.spent=Math.round((Date.now()-T.qStart)/1000); completeBlock(); return; }
  if(T.kind==="sim"){ if(T.i<T.items.length-1){ T.i++; renderSession(); } return; }
  if(T.kind==="migliora" && it.pick===null && !it.locked) return;
  it.locked=true; if(it.spent==null) it.spent=Math.round((Date.now()-T.qStart)/1000);
  if(T.i<T.items.length-1){ T.i++; T.qStart=Date.now(); renderSession(); window.scrollTo(0,0); saveLive(); } else finish();
}
function askEnd(){
  const T=state.T, nDone=T.items.filter(x=>x.pick!==null).length;
  if(T.kind==="sim") dialog({title:"Termina simulazione", body:`Vuoi davvero terminare la simulazione? Hai risposto a ${nDone} quesiti su ${T.items.length}.${nDone<T.items.length?" I quesiti senza risposta valgono 0 punti.":""}`, actions:[{label:"Torna alla prova"},{label:"Termina",primary:true,run:()=>finish()}]});
  else dialog({title:T.kind==="migliora"?"Termina esercitazione":"Termina sessione di studio", body:"Vuoi davvero terminare la sessione di studio? Vedrai subito il riepilogo dei quesiti affrontati finora.", actions:[{label:"Continua la sessione"},{label:"Conferma uscita",primary:true,run:()=>finish()}]});
}
function askLeave(v){
  const T=state.T;
  if(T.kind==="sim") dialog({title:"Simulazione in corso", body:"Stai per abbandonare la simulazione. La simulazione corrente sarà conclusa senza alcuna valutazione. Si desidera procedere?", actions:[{label:"Torna alla prova"},{label:"Esci",primary:true,run:()=>{ T.done=true; clearInterval(timerId); S.h.push({id:T.id,t:Date.now(),k:"sim",title:T.title,n:60,ok:0,sec:Math.round(elapsed()),nc:true}); lsSet(LIVE_KEY,null); lsWrite(); pushAll(); state.view=v; closeDrawerMobile(); render(); window.scrollTo(0,0); }}]});
  else dialog({title:"Sessione in corso", body:"Stai per lasciare la sessione. Le risposte date finora vengono salvate. Si desidera procedere?", actions:[{label:"Continua la sessione"},{label:"Esci",primary:true,run:()=>{ finish(true); state.view=v; closeDrawerMobile(); render(); window.scrollTo(0,0); }}]});

function examPoints(items){ return items.reduce((a,x)=>a+(x.pick===0?Q[x.n-1][3]:0),0); }
function buildEntry(T, counted, tEnd){
  // un test con il dettaglio di ogni domanda: esito e secondi (senza contare pause e domanda lasciata a metà)
  const ok=counted.filter(x=>x.pick===0).length, hasSpent=counted.some(x=>x.spent!=null);
  const sec = T.kind==="sim" ? Math.round((tEnd-T.t0)/1000) : hasSpent ? counted.reduce((a,x)=>a+(x.spent||0),0) : Math.round((tEnd-T.t0)/1000);
  const e={id:T.id, t:tEnd, k:T.kind, title:T.title, n:counted.length, ok, sec, ms:[...new Set(counted.map(x=>Q[x.n-1][0]))],
    start:T.started||T.t0, goal:goalFor(counted.length), g60:goal60(), cats:[...new Set(counted.map(x=>Q[x.n-1][1]))], subs:[...new Set(counted.map(x=>Q[x.n-1][2]))],
    q:counted.map(x=>{ const it=[x.n, x.pick===0?1:x.pick===-2?-2:x.pick===null?0:-1, x.spent==null?null:x.spent]; if(x.order){ it.push([0,1,2,3].includes(x.pick)?x.pick:null, x.order.join("")); } return it; })};
  Object.assign(e, T.meta||{});
  if(T.kind==="sim" && T.items && T.items[0] && T.items[0].order){ e.pts=examPoints(T.items); e.det=T.items.map(x=>[x.n, x.pick===null?-1:x.pick, x.order.join("")]); }
  return e;
}
function finish(silent){
  const T=state.T; if(T.done) return; T.done=true; clearInterval(timerId);
  const cur=T.items[T.i];
  // a tempo scaduto conta anche la domanda a schermo (con il suo tempo) e quelle mai raggiunte, come all'esame
  if(T.kind!=="sim" && cur && cur.spent==null && (cur.pick!==null || cur.locked || T.timeUp)) cur.spent=Math.max(0,Math.round((Date.now()-T.qStart)/1000));
  const counted = T.kind==="sim" || T.timeUp ? T.items : T.items.filter((x,k)=>k<T.i || x.pick!==null || x.locked);
  T.counted = counted;
  const entry=cleanSession(buildEntry(T, counted, Date.now()));
  T.sec = entry ? entry.sec : 0;
  if(counted.length && entry){ S.h.push(entry); derive(); }
  lsSet(LIVE_KEY, null); lsWrite(); pushAll();
  if(!silent){ state.sel=0; state.view="riepilogo"; render(); window.scrollTo(0,0); }
}
function openSaved(h){
  const items=h.det.map(([n,p,o])=>({n, pick:p<0?null:p, order:o.split("").map(Number)}));

    <div class="pager"><button class="btn btn-outlined" id="pp" ${B.page===0?"disabled":""}>${icon("chevron_left")} Precedenti</button><span>Pagina ${B.page+1} di ${pages}</span><button class="btn btn-outlined" id="np" ${B.page>=pages-1?"disabled":""}>Successivi ${icon("chevron_right")}</button></div>
  </section>`;
  $("#b-mat").onchange=e=>{ B.mat=+e.target.value; B.page=0; renderSfoglia(); };
  const bb=$("#b-back"); if(bb) bb.onclick=()=>go("materia");
  const bc=$("#b-clear"); if(bc) bc.onclick=()=>{ B.ids=null; B.label=""; B.page=0; renderSfoglia(); };
  let tm; $("#b-q").oninput=e=>{ clearTimeout(tm); tm=setTimeout(()=>{ if(state.view!=="sfoglia") return; B.q=e.target.value; B.page=0; renderSfoglia(); const el=$("#b-q"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); },250); };
  $("#b-err").onchange=e=>{ B.err=e.target.checked; B.page=0; renderSfoglia(); };
  $("#b-print").onclick=()=>printList(ids, B.label || (B.err ? "Domande sbagliate" : "Domande") + (term ? ` · ricerca «${B.q.trim()}»` : ""));
  $("#pp").onclick=()=>{ B.page--; renderSfoglia(); window.scrollTo(0,0); };
  $("#np").onclick=()=>{ B.page++; renderSfoglia(); window.scrollTo(0,0); };
}

/* ================= tastiera ================= */
document.addEventListener("keydown",e=>{
  if(state.view!=="session"||!state.T||state.T.done||dialogOpen()) return;
  if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return; // Cmd+C, Ctrl+A… restano copia/seleziona
  const T=state.T, it=T.items[T.i], k=e.key.toUpperCase();
  let pos=L.indexOf(k); if(pos<0 && ["1","2","3","4"].includes(k)) pos=+k-1;
  if(pos>=0){ e.preventDefault(); choose(it.order[pos]); return; }
  if(k==="N" || k==="?"){ e.preventDefault(); dontKnow(); return; }
  if(T.kind==="sim"){ if(e.key==="ArrowRight"&&T.i<T.items.length-1){T.i++;renderSession();} else if(e.key==="ArrowLeft"&&T.i>0){T.i--;renderSession();} return; }
  if(e.key==="Enter"){ e.preventDefault(); advance(); }
});
window.addEventListener("beforeunload",()=>{ lsWrite(); saveLive(); });
window.addEventListener("pagehide",()=>{ lsWrite(); saveLive(); });

{ const l=lsRead(); if(l) setLocal(l); } // progressi del dispositivo subito, prima della sincronizzazione
applyZoom(+lsGet("palestra-ocf-zoom")||1);
render();
initStore();
})();
</script>
